name: typecheck

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pyright:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # Install declared runtime deps so pyright can resolve them.
          # Frappe itself is intentionally NOT installed — pyrightconfig.json
          # silences `reportMissingImports` for the `frappe` namespace.
          pip install \
            "requests>=2.31.0" \
            "PyJWT>=2.8.0" \
            "cryptography>=41.0.0" \
            "python-dateutil>=2.8.0" \
            "simple-salesforce>=1.12.5"

      - name: Install pyright
        run: pip install "pyright==1.1.409"

      - name: Run pyright
        run: pyright
