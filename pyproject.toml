[project]
name = "frappe_salesforce"
version = "0.1.9"
description = "Salesforce (SOQL) integration for Frappe CRM"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "python-dateutil>=2.8.0",
    "simple-salesforce>=1.12.5",
]

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "frappe_salesforce"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
crm = ">=1.0.0"
